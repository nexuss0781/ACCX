name: Security and release verification

on:
  pull_request:
  push:
    branches: [main, feat/vercel-paradox-vault]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:api
      - run: pnpm run check:sdk
      - run: pnpm exec vitest run
      - run: pnpm run build
      - run: pnpm audit --audit-level high
      - run: pnpm --dir packages/sdk-js pack --dry-run
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel --outdir /tmp/accx-wheel packages/sdk-python
      - run: node --check worker/accx-worker.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
