name: Publish ACCX SDKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already applied to both SDK manifests
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH to permit external registry publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm_publish == 'PUBLISH' }}
    runs-on: ubuntu-latest
    environment: package-publication
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:sdk
      - run: pnpm --dir packages/sdk-js pack --dry-run
      - run: python -m pip install --upgrade build twine
      - run: python -m build --wheel --outdir /tmp/accx-wheel packages/sdk-python
      - run: python -m twine check /tmp/accx-wheel/*
      - name: Verify requested package versions
        run: |
          test "$(node -p "require('./packages/sdk-js/package.json').version")" = "${{ inputs.version }}"
          test "$(python -c "import tomllib; print(tomllib.load(open('packages/sdk-python/pyproject.toml','rb'))['project']['version'])")" = "${{ inputs.version }}"
      - run: pnpm --dir packages/sdk-js publish --access public --no-git-checks
        env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
      - run: python -m twine upload /tmp/accx-wheel/*
        env: { TWINE_USERNAME: __token__, TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }} }
